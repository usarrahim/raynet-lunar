[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raynet"
version = "0.1.0"
description = "RayNet: lunar pathloss radio maps with a physics prior and a ray-wise horizon scan."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abdurrahim Yılmaz" }]
requires-python = ">=3.10"
# Same list as requirements.txt. Install PyTorch first, matched to your computer.
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
