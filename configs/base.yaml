# Shared training budget for all trained experiments (docs/03_MODEL.md, "Training defaults").
# Experiments override only what they test. Run name = <id>_<band>_s<seed>.
# Budget fixed in task P2.2 (2026-11-14) from the Colab speed test on a Tesla T4
# (E3, 5.8 GHz, 300 steps, batch 16, AMP): width 24 = 76 maps/s, 2.65 GB; width 32 = 61 maps/s,
# 3.52 GB. Width 24 with 16 epochs is about 1.5 h for E3 at 5.8 GHz (24414 maps per epoch).
# Do not change these numbers between experiments (fair comparison).
id: E3
band: "58"
seed: 0
model:
  kind: e3          # e2 = direct, e3 = residual on the E1b prior
  width: 24
train:
  epochs: 16
  batch_size: 16
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_epochs: 1
  lr_min: 1.0e-5
  grad_clip: 1.0
  amp: true
  augment: true     # 8 dihedral transforms, train only
  num_workers: 2    # Colab runtime has 2 CPUs; the run may override it, the budget does not change
data:
  dev_file: splits/dev_terrains.txt
  e1b_coeffs: results/e1b_coeffs.json
eval:
  dev_every: 1      # dev RMSE every N epochs (monitor only, no early stopping)
